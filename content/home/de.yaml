work_heading: Woran ich arbeite
work:
  - title: Agent-Routing und Werkzeuge
    text: "Einfache Nachrichten gehen an ein günstiges Modell, komplexe an ein starkes. Werkzeuge bekommen nur die starken: nur lesend, ausser einem, das Notizen schreibt."
    href: /vision/agent-core/
  - title: Evals mit Held-out-Sets
    text: Eine Zahl vor und nach jeder Änderung, geprüft an zurückgehaltenen Testfällen, die nie zum Optimieren verwendet wurden.
    href: /vision/eval-harness/
  - title: LLM-Kostenkontrolle
    text: Ein Gateway für jeden Modellaufruf, mit eigenem Schlüssel und Budget für jeden Ablauf.
    href: /vision/litellm-gateway/
  - title: Guardrails für Coding-Agenten
    text: Mehrere Prüfschichten, damit ein KI-Agent ein System bauen kann, während jeder Merge bei mir bleibt.
    href: /vision/guardrails/
