title: Patrick Diaz — KI-Agent-Systeme
description: Patrick Diaz baut selbst gehostete KI-Agent-Systeme, die gemessen, budgetiert und abgesichert sind.
positioning: Ich baue selbst gehostete KI-Agent-Systeme, die gemessen, budgetiert und abgesichert sind.
looking_for: Ich suche Stellen im Bereich Applied AI / Agent Engineering.
background:
  - Ich arbeite im IT-Betrieb der Schweizerischen Bundesverwaltung und studiere Informatik an der FFHS (BSc, voraussichtlich 2027), mit Schwerpunkt Machine Learning und Data Engineering. Ich spreche Deutsch, Spanisch, Englisch und Französisch.
  - "Mein Fokus sind KI-Agenten: wie sie Arbeit zwischen Modellen verteilen, Werkzeuge sicher nutzen und mit Zahlen belegen, dass eine Änderung geholfen hat. Vision, mein eigener Agent-Harness, ist der Ort, an dem ich das baue und teste."
featured:
