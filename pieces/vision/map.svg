<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="schematic" role="group" aria-labelledby="map-title">
  <title id="map-title">Vision schematic: how the parts connect</title>
  <!-- Annotated schematic (D13, PLAN 1.3). Each part is a <g id class="part"> with no nested
       <g>; its id equals its map.yaml id. The page turns each into a link. A part holds its
       own wire (the signal dot runs along it), a focus ring, its box and its labels. -->

  <!-- Frames and sheet marks -->
  <g class="frame" aria-hidden="true">
    <rect x="20" y="20" width="1160" height="540" />
    <text class="frame-t" x="36" y="46">RUNTIME</text>
    <rect x="20" y="590" width="1160" height="150" />
    <text class="frame-t" x="36" y="616">BUILD SIDE</text>
    <text class="dim-t" x="1164" y="728" text-anchor="end">SHEET 01 · VISION</text>
    <path class="dim" d="M60 168 V178 M280 168 V178 M60 173 H280" />
    <text class="dim-t" x="170" y="192" text-anchor="middle">SURFACES</text>
  </g>

  <!-- Side notes: hand-lettered, amber, dashed lead lines -->
  <g class="notes">
    <path class="note-line" d="M450 58 V70" />
    <text class="note" x="190" y="52">commands: no model · simple → cheap · complex → smart</text>
    <text class="note" x="810" y="45">aliases only: smart · cheap · local · embed</text>
    <path class="note-line" d="M700 316 L730 290" />
    <text class="note" x="640" y="334">read-only, per-key tool lists</text>
    <path class="note-line" d="M450 426 V438" />
    <text class="note" x="356" y="455">run + step id join the spend log</text>
  </g>

  <!-- Gateway terminal: the models behind the aliases -->
  <g class="terminal" aria-hidden="true">
    <circle cx="730" cy="40" r="4" />
    <text class="dim-t" x="742" y="45">MODELS</text>
  </g>

  <g id="telegram-adapter" class="part">
    <path class="wire" d="M280 108 H340" />
    <rect class="ring" x="54" y="64" width="232" height="88" />
    <rect class="box" x="60" y="70" width="220" height="76" />
    <text class="lbl" x="76" y="102">TELEGRAM ADAPTER</text>
    <text class="st" x="76" y="128">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M280 108 H340')" />
  </g>

  <g id="console" class="part">
    <path class="wire" d="M280 248 H310 V128 H340" />
    <rect class="ring" x="54" y="204" width="232" height="88" />
    <rect class="box" x="60" y="210" width="220" height="76" />
    <text class="lbl" x="76" y="242">CONSOLE</text>
    <text class="st" x="76" y="268">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M280 248 H310 V128 H340')" />
  </g>

  <g id="agent-core" class="part">
    <path class="wire" d="M560 108 H620" />
    <rect class="ring" x="334" y="64" width="232" height="88" />
    <rect class="box" x="340" y="70" width="220" height="76" />
    <text class="lbl" x="356" y="102">AGENT CORE</text>
    <text class="st" x="356" y="128">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M560 108 H620')" />
  </g>

  <g id="claude-worker" class="part">
    <path class="wire" d="M450 210 V146" />
    <rect class="ring" x="334" y="204" width="232" height="88" />
    <rect class="box" x="340" y="210" width="220" height="76" />
    <text class="lbl" x="356" y="242">CLAUDE WORKER TIER</text>
    <text class="st" x="356" y="268">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M450 210 V146')" />
  </g>

  <g id="run-records" class="part">
    <path class="wire" d="M340 388 H325 V138 H340" />
    <rect class="ring" x="334" y="344" width="232" height="88" />
    <rect class="box" x="340" y="350" width="220" height="76" />
    <text class="lbl" x="356" y="382">RUN RECORDS</text>
    <text class="st" x="356" y="408">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M340 388 H325 V138 H340')" />
  </g>

  <g id="litellm-gateway" class="part">
    <path class="wire" d="M730 70 V44" />
    <rect class="ring" x="614" y="64" width="232" height="88" />
    <rect class="box" x="620" y="70" width="220" height="76" />
    <text class="lbl" x="636" y="102">LITELLM GATEWAY</text>
    <text class="st" x="636" y="128">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M730 70 V44')" />
  </g>

  <g id="mcp-servers" class="part">
    <path class="wire" d="M730 210 V146" />
    <rect class="ring" x="614" y="204" width="232" height="88" />
    <rect class="box" x="620" y="210" width="220" height="76" />
    <text class="lbl" x="636" y="242">MCP SERVERS</text>
    <text class="st" x="636" y="268">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M730 210 V146')" />
  </g>

  <g id="knowledge-core" class="part">
    <path class="wire" d="M900 248 H840" />
    <rect class="ring" x="894" y="204" width="232" height="88" />
    <rect class="box" x="900" y="210" width="220" height="76" />
    <text class="lbl" x="916" y="242">KNOWLEDGE CORE</text>
    <text class="st" x="916" y="268">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M900 248 H840')" />
  </g>

  <g id="eval-harness" class="part">
    <path class="wire" d="M900 108 H840" />
    <rect class="ring" x="894" y="64" width="232" height="88" />
    <rect class="box" x="900" y="70" width="220" height="76" />
    <text class="lbl" x="916" y="102">EVAL HARNESS</text>
    <text class="st" x="916" y="128">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M900 108 H840')" />
  </g>

  <g id="heartbeat" class="part">
    <path class="wire" d="M280 508 H340" />
    <rect class="ring" x="54" y="464" width="232" height="88" />
    <rect class="box" x="60" y="470" width="220" height="76" />
    <text class="lbl" x="76" y="502">HEARTBEAT</text>
    <text class="st" x="76" y="528">PLANNED · NOT BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M280 508 H340')" />
  </g>

  <g id="job-contract" class="part">
    <path class="wire" d="M560 508 H590 V128 H560" />
    <rect class="ring" x="334" y="464" width="232" height="88" />
    <rect class="box" x="340" y="470" width="220" height="76" />
    <text class="lbl" x="356" y="502">JOB CONTRACT</text>
    <text class="st" x="356" y="528">PLANNED · NOT BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M560 508 H590 V128 H560')" />
  </g>

  <g id="sandbox" class="part">
    <path class="wire" d="M620 528 H560" />
    <rect class="ring" x="614" y="464" width="232" height="88" />
    <rect class="box" x="620" y="470" width="220" height="76" />
    <text class="lbl" x="636" y="502">SANDBOX</text>
    <text class="st" x="636" y="528">PLANNED · NOT BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M620 528 H560')" />
  </g>

  <g id="guardrails" class="part">
    <path class="wire" d="M280 668 H340" />
    <rect class="ring" x="54" y="624" width="232" height="88" />
    <rect class="box" x="60" y="630" width="220" height="76" />
    <text class="lbl" x="76" y="662">GUARDRAILS</text>
    <text class="st" x="76" y="688">BUILT</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M280 668 H340')" />
  </g>

  <!-- What the guardrails wrap: not a part of the runtime -->
  <g class="terminal" aria-hidden="true">
    <circle cx="344" cy="668" r="4" />
    <text class="dim-t" x="356" y="672">CLAUDE CODE SESSIONS THAT BUILD VISION</text>
  </g>
</svg>
