<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" class="schematic" role="group" aria-label="Vision schematic: how the parts connect">
  <!-- Annotated schematic (D13, PLAN 1.3). Only built parts are drawn (Patrick, 2026-11-11).
       Each part is a <g id class="part"> with no nested <g>; its id equals its map.yaml id,
       and the page turns it into a link. A part holds its own wire (the signal dot runs
       along it), a focus ring, its box and its label. No <title>: it would show as a
       tooltip; the name is the aria-label. -->

  <!-- Frames and sheet marks -->
  <g class="frame" aria-hidden="true">
    <path d="M20 20 H1060 V320 H530 V440 H20 Z" />
    <text class="frame-t" x="36" y="44">RUNTIME</text>
    <rect x="540" y="330" width="520" height="110" />
    <text class="frame-t" x="556" y="352">BUILD SIDE</text>
    <path class="dim" d="M40 92 V100 M260 92 V100 M40 96 H260" />
    <text class="dim-t" x="150" y="86" text-anchor="middle">SURFACES</text>
    <text class="dim-t" x="1044" y="430" text-anchor="end">SHEET 01 · VISION</text>
  </g>

  <!-- Side notes: hand-lettered, amber, dashed lead lines -->
  <g class="notes">
    <text class="note" x="300" y="62">commands: no model</text>
    <text class="note" x="300" y="84">simple → cheap · complex → smart</text>
    <path class="note-line" d="M410 92 V110" />
    <text class="note" x="44" y="326">run + step id join the spend log</text>
    <path class="note-line" d="M150 332 V350" />
  </g>

  <!-- Gateway terminals: the models behind the aliases -->
  <g class="terminal" aria-hidden="true">
    <path class="wire-static" d="M640 80 H676" />
    <circle cx="680" cy="48" r="4" />
    <text class="dim-t" x="692" y="52">SMART · CHEAP → MODEL PROVIDER</text>
    <circle cx="680" cy="80" r="4" />
    <text class="dim-t" x="692" y="84">LOCAL · EMBED → MODELS ON MY GPU PC</text>
    <text class="dim-t" x="692" y="100">(EMBED FALLS BACK TO CPU)</text>
  </g>

  <g id="telegram-adapter" class="part">
    <path class="wire" d="M260 142 H300" />
    <rect class="ring" x="34" y="104" width="232" height="76" />
    <rect class="box" x="40" y="110" width="220" height="64" />
    <text class="lbl" x="56" y="148">TELEGRAM ADAPTER</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M260 142 H300')" />
  </g>

  <g id="console" class="part">
    <path class="wire" d="M260 262 H275 V160 H300" />
    <rect class="ring" x="34" y="224" width="232" height="76" />
    <rect class="box" x="40" y="230" width="220" height="64" />
    <text class="lbl" x="56" y="268">CONSOLE</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M260 262 H275 V160 H300')" />
  </g>

  <g id="agent-core" class="part">
    <path class="wire" d="M520 142 H560" />
    <rect class="ring" x="294" y="104" width="232" height="76" />
    <rect class="box" x="300" y="110" width="220" height="64" />
    <text class="lbl" x="316" y="148">AGENT CORE</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M520 142 H560')" />
  </g>

  <g id="claude-worker" class="part">
    <path class="wire" d="M410 230 V174" />
    <rect class="ring" x="294" y="224" width="232" height="76" />
    <rect class="box" x="300" y="230" width="220" height="64" />
    <text class="lbl" x="316" y="268">CLAUDE WORKER TIER</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M410 230 V174')" />
  </g>

  <g id="run-records" class="part">
    <path class="wire" d="M285 350 V170 H300" />
    <rect class="ring" x="34" y="344" width="492" height="76" />
    <rect class="box" x="40" y="350" width="480" height="64" />
    <text class="lbl" x="56" y="388">RUN RECORDS</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M285 350 V170 H300')" />
  </g>

  <g id="litellm-gateway" class="part">
    <path class="wire" d="M640 110 V48 H676" />
    <rect class="ring" x="554" y="104" width="232" height="76" />
    <rect class="box" x="560" y="110" width="220" height="64" />
    <text class="lbl" x="576" y="148">LITELLM GATEWAY</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M640 110 V48 H676')" />
  </g>

  <g id="mcp-servers" class="part">
    <path class="wire" d="M670 230 V174" />
    <rect class="ring" x="554" y="224" width="232" height="76" />
    <rect class="box" x="560" y="230" width="220" height="64" />
    <text class="lbl" x="576" y="268">MCP SERVERS</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M670 230 V174')" />
  </g>

  <g id="eval-harness" class="part">
    <path class="wire" d="M820 142 H780" />
    <rect class="ring" x="814" y="104" width="232" height="76" />
    <rect class="box" x="820" y="110" width="220" height="64" />
    <text class="lbl" x="836" y="148">EVAL HARNESS</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M820 142 H780')" />
  </g>

  <g id="knowledge-core" class="part">
    <path class="wire" d="M820 262 H780" />
    <rect class="ring" x="814" y="224" width="232" height="76" />
    <rect class="box" x="820" y="230" width="220" height="64" />
    <text class="lbl" x="836" y="268">KNOWLEDGE CORE</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M820 262 H780')" />
  </g>

  <g id="guardrails" class="part">
    <path class="wire" d="M780 394 H820" />
    <rect class="ring" x="554" y="356" width="232" height="76" />
    <rect class="box" x="560" y="362" width="220" height="64" />
    <text class="lbl" x="576" y="400">GUARDRAILS</text>
    <circle class="signal-dot" r="5" style="offset-path: path('M780 394 H820')" />
  </g>

  <!-- What the guardrails wrap: not a part of the runtime -->
  <g class="terminal" aria-hidden="true">
    <circle cx="824" cy="394" r="4" />
    <text class="dim-t" x="836" y="390">CLAUDE CODE SESSIONS</text>
    <text class="dim-t" x="836" y="408">THAT BUILD VISION</text>
  </g>
</svg>
