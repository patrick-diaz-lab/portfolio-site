# The Vision piece (PLAN 1.3, D19). Text rewritten from sources/vision/, never pasted.
id: vision
title: Vision
tagline: "A self-hosted agent harness: my personal AI assistant, answering from my docs, notes, files and homelab."
summary: >-
  One chat in front. A supervisor sends simple messages to a cheap model and complex ones to
  a strong one with tools. One gateway holds every key and budget, and evals run before and
  after each change. Claude Code writes most of the code, under guardrails I specified; I set
  the rules, approve plans, review and merge.
status: built
as_of: 2026-11-12
source_commit: 8b2a08b580419fd5f06330fce3b7e25a982b0150
order: 1
map_svg: map.svg
chat_enabled: false
