# German text of the Vision map (PLAN 1.9a): label and hover per part id of map.yaml, the
# schematic's name, and every keyed text in map.svg (data-t). Box labels at most 18
# characters, so they fit the schematic. The words follow the German part pages (Lauf,
# Werkzeug, Docs, der Eval-Harness), so the overview and the pages read as one text.
aria_label: "Vision-Schema: wie die Teile verbunden sind"
parts:
  telegram-adapter:
    label: Telegram-Adapter
    hover: "Der Chat, über den ich mit Vision spreche. Jede Nachricht geht an den Agent-Core; Kontext sind nur die letzten 10 Züge aus 6 Stunden."
  console:
    label: Konsole
    hover: "Private Web-Konsole für Chat und Traces: jeder Schritt, jeder Werkzeugaufruf und die Kosten eines Laufs. Nur im privaten Netz erreichbar."
  agent-core:
    label: Agent-Core
    hover: "Der Supervisor hinter dem Chat. Befehle laufen ohne Modell; ein lokaler Klassifikator schickt den Rest an ein günstiges oder starkes Modell."
  claude-worker:
    label: Claude-Worker
    hover: "Ein Claude-Code-Worker auf meinem Abo, nur für meine eigenen Nachrichten. Ein filternder Proxy lässt nur Anbieter-API und Gateway-Tools zu."
  run-records:
    label: Laufprotokolle
    hover: "Jede Arbeit ist ein Lauf mit Schritten, Tokens und Kosten. Volle Traces bleiben 30 Tage zur Prüfung, dann gelöscht, ausser ich markiere sie."
  litellm-gateway:
    label: LiteLLM-Gateway
    hover: "Ein Gateway für jeden Modellaufruf: Aliase statt Modellnamen; Schlüssel und 30-Tage-Budget pro Ablauf, unter einem Gesamtlimit."
  mcp-servers:
    label: MCP-Server
    hover: "Eigene Server für Docs, Notizen, Dateien, Homelab-Status: nur lesend, ausser einem Werkzeug für neue Notizen. Nur übers Gateway erreichbar."
  knowledge-core:
    label: Wissenskern
    hover: "Suche über meine Docs, Notizen und PDFs hinter dem Knowledge-Server. Der Eval-Harness misst, wie oft das richtige Dokument in den Top 5 ist."
  eval-harness:
    label: Eval-Harness
    hover: "Prüft den Produktionscode an Dev- und Held-out-Sets, mit eigenem Schlüssel und Budget. Die Metriken prüft Code, kein LLM als Richter."
  guardrails:
    label: Guardrails
    hover: "Hooks, die jeden Befehl prüfen, den Claude Code beim Bau von Vision ausführt, dazu ein Pre-Push-Hook und ein Secret-Scan."
