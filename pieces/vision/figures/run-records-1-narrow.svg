<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 364 524" class="schematic figure-svg">
  <!-- FIG. run records, narrow version for phones (layout 3). Same content as the wide one,
       stacked. -->
  <rect class="box" x="100" y="20" width="160" height="56" />
  <text class="lbl fig-mid" x="180" y="44">RUN</text>
  <text class="fig-sub fig-mid" x="180" y="64">ONE PER PIECE OF WORK</text>

  <path class="wire-static" d="M180 76 V92 H30 V380 M30 130 H51 M30 210 H51 M30 290 H51" />
  <polygon class="fig-head" points="59,130 51,126 51,134" />
  <polygon class="fig-head" points="59,210 51,206 51,214" />
  <polygon class="fig-head" points="59,290 51,286 51,294" />
  <rect class="box" x="60" y="105" width="160" height="50" />
  <text class="lbl fig-mid" x="140" y="128">MODEL CALL</text>
  <text class="fig-sub fig-mid" x="140" y="146">ONE STEP</text>
  <rect class="box" x="60" y="185" width="160" height="50" />
  <text class="lbl fig-mid" x="140" y="208">TOOL CALL</text>
  <text class="fig-sub fig-mid" x="140" y="226">ONE STEP</text>
  <rect class="box" x="60" y="265" width="160" height="50" />
  <text class="lbl fig-mid" x="140" y="288">COMMAND</text>
  <text class="fig-sub fig-mid" x="140" y="306">ONE STEP</text>

  <path class="wire-static" d="M220 130 H241 M220 210 H241" />
  <polygon class="fig-head" points="249,130 241,126 241,134" />
  <polygon class="fig-head" points="249,210 241,206 241,214" />
  <rect class="box" x="250" y="105" width="110" height="50" />
  <text class="lbl fig-mid" x="305" y="128">SPEND LOG</text>
  <text class="fig-sub fig-mid" x="305" y="146">GATEWAY</text>
  <rect class="box" x="250" y="185" width="110" height="50" />
  <text class="lbl fig-mid" x="305" y="208">CHILD RUN</text>
  <text class="fig-sub fig-mid" x="305" y="226">MCP SERVER</text>
  <text class="note" x="232" y="98">run + step no.</text>

  <path class="wire-static" d="M30 380 H280 M100 380 V391 M280 380 V391" />
  <polygon class="fig-head" points="100,399 96,391 104,391" />
  <polygon class="fig-head" points="280,399 276,391 284,391" />
  <rect class="box" x="20" y="400" width="160" height="56" />
  <text class="lbl fig-mid" x="100" y="424">RUN RECORD</text>
  <text class="fig-sub fig-mid" x="100" y="444">COUNTS · COSTS</text>
  <rect class="box" x="200" y="400" width="160" height="56" />
  <text class="lbl fig-mid" x="280" y="424">TRACE STORE</text>
  <text class="fig-sub fig-mid" x="280" y="444">FULL CONTENT</text>
  <text class="note" x="200" y="484">deleted after 30 days,</text>
  <text class="note" x="200" y="506">unless flagged</text>
</svg>
