title: Vision
tagline: Ein selbst gehosteter Agent-Harness für mein Home-Intelligence-Center.
summary: >-
  Vorne ein Chat, dahinter ein Supervisor, der jede Nachricht an das günstigste Modell
  schickt, das sie beantworten kann. Werkzeuge nur zum Lesen, ein Gateway für alle
  Schlüssel und Budgets, Evals vor und nach jeder Änderung. Claude Code baut es, innerhalb
  von Guardrails, die ich geschrieben habe.
