# German text of the Vision piece (PLAN 1.9a). Only text: numbers, ids and dates stay in
# piece.yaml. Written in Swiss Standard German (ss, no ß); reviewed by Patrick in the PR.
title: Vision
tagline: "Ein selbst gehosteter Agent-Harness: mein persönlicher KI-Assistent für meine Docs, Notizen, Dateien und mein Homelab."
summary: >-
  Vorne ein Chat. Ein Supervisor schickt einfache Nachrichten an ein günstiges Modell,
  komplexe an ein starkes mit Werkzeugen. Ein Gateway für alle Schlüssel und Budgets, Evals
  vor und nach jeder Änderung. Claude Code schreibt den Grossteil des Codes, in Guardrails,
  die ich vorgegeben habe; ich lege die Regeln fest, gebe Pläne frei, reviewe und merge.
# Chips, in the order of the chips in piece.yaml: a label, or a label and the chip's note.
chips:
  - Nachrichten richtig geroutet, internes Testset
  - Eingeschleuste Anweisung wiederholt
  - label: Benchmark gelöst, gleich wie Claude Code
    note: 46 Fälle, je zweimal
chips_note: "Internes Testset: 27 Fälle, von Claude entworfen und von mir geprüft. Nur Gesamtwerte."
