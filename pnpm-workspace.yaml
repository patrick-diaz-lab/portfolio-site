# Supply-chain settings (D7, PLAN 0.2).
# Refuse any version published less than 14 days ago (value in minutes).
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
# Dependency build scripts stay off; an entry here is a reviewed exception.
strictDepBuilds: true
allowBuilds:
  # Reviewed exceptions (PLAN 0.4): each downloads its own native binary at install.
  esbuild: true    # bundler under Vite/Astro and wrangler
  workerd: true    # Workers runtime used by wrangler
# sharp (and its prebuilt libvips binaries) is never used: Astro runs with the passthrough
# image service, and miniflare loads it only lazily for local image emulation (PLAN 0.4).
overrides:
  sharp: "-"
