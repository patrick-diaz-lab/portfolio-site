# `pnpm check` and the planted-finding tests on every PR and on main (PLAN 0.2, D20), and
# the browser gates (PLAN 1.8). Required status checks "check" and "gates" on the main
# ruleset. Triggered by pull_request, never pull_request_target; read-only token; no
# secrets; every action pinned by full commit SHA. The scan prints only rule ids and
# file:line, never matched text (D9, D20 risk 5).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/gitleaks/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:check
      - run: pnpm build

  # Browser gates (PLAN 1.8): axe, map, focus, no-JS, reduced motion, the broken-focus
  # self-test, and Lighthouse with its size budget. The browser is the pinned Playwright's
  # own Chromium, installed by Playwright's installer; no system Chrome is used.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec astro build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: pnpm gates
